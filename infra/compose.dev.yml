name: pokecord-local
services:
  postgres:
    image: postgres:17.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: pokecord
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: pokecord_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokecord -d pokecord_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
